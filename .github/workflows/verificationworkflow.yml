name: Temporary RA3FPS Windows verification
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric private draft release ID
        required: true
      asset:
        description: Installer asset in the private draft
        required: true
        default: RA3FPS_Setup_0.3.4_NSIS.exe
      sha256:
        description: SHA-256 of the candidate installer
        required: true
        default: 1b605293e2d7fb73f53bf095ce73649cf31ea89267c102d6bb220bc4949da4ce
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Ubuntu Wine and GUI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 wine xvfb xauth xdotool imagemagick gcc-mingw-w64-x86-64 python3-xlib python3-pil
      - name: Download the private draft installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ inputs.asset }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          mkdir -p evidence
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  out=super().redirect_request(req,fp,code,msg,headers,url)
                  if urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(url).netloc:
                      out.remove_header('Authorization')
                  return out
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          opener=urllib.request.build_opener(Redirect)
          def open_request(request):
              try:return opener.open(request)
              except urllib.error.HTTPError as error:
                  try:body=json.loads(error.read().decode('utf-8',errors='replace'))
                  except (ValueError,UnicodeError):body={}
                  # Only GitHub's diagnostic fields; never headers, tokens or signed URLs.
                  safe={key:body[key] for key in ('message','documentation_url','status') if key in body}
                  message=json.dumps(safe,ensure_ascii=True).replace(os.environ['GH_TOKEN'],'[redacted]')
                  raise RuntimeError('GitHub HTTP '+str(error.code)+': '+message) from None
          release_id=os.environ['RELEASE_ID'];assert release_id.isdecimal(),'Numeric release ID required'
          release=json.load(open_request(urllib.request.Request(api+'/releases/'+release_id,headers=headers)))
          assert release['draft'] is True,'Candidate must remain a private draft'
          asset=next(a for a in release['assets'] if a['name']==os.environ['ASSET_NAME'])
          headers['Accept']='application/octet-stream'
          data=open_request(urllib.request.Request(api+'/releases/assets/'+str(asset['id']),headers=headers)).read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest==os.environ['EXPECTED_SHA'].lower(),'Installer SHA-256 mismatch'
          pathlib.Path('candidate.exe').write_bytes(data)
          pathlib.Path('evidence/download.json').write_text(json.dumps({'draft':True,'asset':asset['name'],'bytes':len(data),'sha256':digest},indent=2))
          headers['Accept']='application/vnd.github+json'
          baseline=json.load(open_request(urllib.request.Request(api+'/releases/tags/0.3.3',headers=headers)))
          assert baseline['draft'] is False and baseline['tag_name']=='0.3.3','Baseline must be the public 0.3.3 release'
          old_asset=next(a for a in baseline['assets'] if a['name']=='RA3FPS_Setup_0.3.3_NSIS.exe')
          headers['Accept']='application/octet-stream'
          old_data=open_request(urllib.request.Request(api+'/releases/assets/'+str(old_asset['id']),headers=headers)).read()
          old_digest=hashlib.sha256(old_data).hexdigest()
          assert old_digest=='8353b51fbeada647d31aa0793b4ddb7f2009bfb006a2b965c0d133ed660b1932' and len(old_data)==3811126,'Baseline installer bytes differ'
          pathlib.Path('baseline.exe').write_bytes(old_data)
          pathlib.Path('evidence/baseline-download.json').write_text(json.dumps({'draft':False,'version':'0.3.3','asset':old_asset['name'],'bytes':len(old_data),'sha256':old_digest},indent=2))
          PY
      - name: Build the read-only Windows UI probe
        run: |
          cat > probe.c <<'C'
          /* Test-only bounded UI/registry/environment probe; never installed by setup. */
          #include <windows.h>
          #include <stdio.h>
          #include <wchar.h>
          static int launcher,action;
          static DWORD deadline;
          static int expired(void){return (LONG)(GetTickCount()-deadline)>=0;}
          static int gettext(HWND h,WCHAR*s,int count){DWORD_PTR result=0;s[0]=0;if(expired())return 0;return SendMessageTimeoutW(h,WM_GETTEXT,count,(LPARAM)s,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result)!=0;}
          static void value(const char*key,const WCHAR*text){char b[16384]={0};WideCharToMultiByte(CP_UTF8,0,text,-1,b,sizeof(b),0,0);printf("%s%s\n",key,b);fflush(stdout);}
          static void line(HWND h){WCHAR s[4096]={0};if(!gettext(h,s,4096))return;for(WCHAR*p=s;*p;p++)if(*p=='\n'||*p=='\r')*p=' ';if(*s)value("",s);}
          static BOOL CALLBACK child(HWND h,LPARAM x){
            if(expired())return FALSE;
            if(IsWindowVisible(h)){
              WCHAR c[128]={0},s[4096]={0};GetClassNameW(h,c,128);line(h);
              if(lstrcmpiW(c,L"Edit")==0&&gettext(h,s,4096))value("EDIT=",s);
            }
            return !expired();
          }
          static BOOL CALLBACK window(HWND h,LPARAM x){
            if(expired())return FALSE;if(!IsWindowVisible(h))return TRUE;
            WCHAR c[128]={0},t[256]={0};GetClassNameW(h,c,128);DWORD pid=0;GetWindowThreadProcessId(h,&pid);
            fprintf(stderr,"WINDOW hwnd=%p pid=%lu\n",h,pid);fflush(stderr);
            if(!gettext(h,t,256))return !expired();
            if(launcher?wcscmp(c,L"BegosikRA3FPS")!=0:wcsstr(t,L"RA3 60 FPS Patcher Setup")==0)return TRUE;
            printf("PID=%lu\nHWND=%p\n",pid,h);fflush(stdout);line(h);EnumChildWindows(h,child,0);
            if(launcher){HWND check=GetDlgItem(h,102);printf("CHECK_ENABLED=%d\n",check&&IsWindowEnabled(check));fflush(stdout);}
            if(action==1){HWND yes=GetDlgItem(h,IDYES);if(yes){DWORD_PTR result=0;SendMessageTimeoutW(yes,BM_CLICK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result);}else PostMessageW(h,WM_CLOSE,0,0);}
            if(action==2){HWND next=GetDlgItem(h,IDOK);DWORD_PTR result=0;if(!next||!SendMessageTimeoutW(next,BM_CLICK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result))fprintf(stderr,"NEXT_BUTTON_UNAVAILABLE\n");}
            return !expired();
          }
          static int command(WCHAR*text){
            WCHAR cmd[32768];STARTUPINFOW si={0};PROCESS_INFORMATION pi={0};si.cb=sizeof(si);lstrcpynW(cmd,text,32768);
            if(!CreateProcessW(0,cmd,0,0,0,0,0,0,&si,&pi)){printf("CREATE_ERROR=%lu\n",GetLastError());return 1;}
            printf("RUN_PID=%lu\n",pi.dwProcessId);fflush(stdout);DWORD wait=WaitForSingleObject(pi.hProcess,150000),code=1;
            if(wait==WAIT_OBJECT_0)GetExitCodeProcess(pi.hProcess,&code);printf("RUN_EXIT=%lu\n",code);CloseHandle(pi.hThread);CloseHandle(pi.hProcess);return (int)code;
          }
          static int fake_arp(WCHAR*path){
            HKEY key=0;LONG code=RegCreateKeyExW(HKEY_CURRENT_USER,L"Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\BegosikRA3FPS",0,0,0,KEY_SET_VALUE|KEY_WOW64_64KEY,0,&key,0);
            if(!code){code=RegSetValueExW(key,L"InstallLocation",0,REG_SZ,(const BYTE*)path,(DWORD)((wcslen(path)+1)*sizeof(WCHAR)));RegCloseKey(key);}
            printf("REGISTRY_RESULT=%ld\n",code);return code?1:0;
          }
          int wmain(int argc,WCHAR**argv){
            fprintf(stderr,"START argc=%d\n",argc);fflush(stderr);
            if(argc>2&&wcscmp(argv[1],L"run")==0)return command(argv[2]);
            if(argc>2&&wcscmp(argv[1],L"fake-arp")==0)return fake_arp(argv[2]);
            if(argc>1&&wcscmp(argv[1],L"env")==0){WCHAR path[4096]={0};if(!GetEnvironmentVariableW(L"LOCALAPPDATA",path,4096))return 1;value("LOCALAPPDATA=",path);return 0;}
            launcher=argc>1&&wcscmp(argv[1],L"launcher")==0;
            action=argc>2&&wcscmp(argv[2],L"close")==0?1:argc>2&&wcscmp(argv[2],L"next")==0?2:0;
            deadline=GetTickCount()+2000;fprintf(stderr,"ENUMBEGIN\n");fflush(stderr);EnumWindows(window,0);
            if(action==1){Sleep(500);deadline=GetTickCount()+2000;EnumWindows(window,0);}
            fprintf(stderr,"ENUMEND\n");fflush(stderr);return 0;
          }
          C
          x86_64-w64-mingw32-gcc -O2 -municode -static -o probe.exe probe.c -luser32
      - name: Exercise the real installer and launcher in Wine
        env:
          WINEPREFIX: ${{ runner.temp }}/ra3fps-verification-prefix
          WINEDEBUG: '-all'
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' /usr/bin/python3 - <<'PY'
          import configparser,hashlib,json,os,pathlib,re,shutil,subprocess,time,traceback
          from Xlib import display,X
          from Xlib.ext import damage
          from PIL import Image
          evidence=pathlib.Path('evidence');prefix=pathlib.Path(os.environ['WINEPREFIX']).resolve()
          wine='/usr/lib/wine/wine64';setup=str(pathlib.Path('candidate.exe').resolve());baseline_setup=str(pathlib.Path('baseline.exe').resolve());probe=str(pathlib.Path('probe.exe').resolve())
          report={};children=[];logs=[]
          def win(path):
              p=pathlib.Path(path).resolve();drive=prefix/'drive_c'
              return ('C:\\'+p.relative_to(drive).as_posix().replace('/','\\')) if p.is_relative_to(drive) else ('Z:'+str(p).replace('/','\\'))
          def command(target,*args):
              # Pass one raw Windows command through the probe, preserving unquoted /D=.
              return [wine,probe,'run','"'+win(target)+'" '+ ' '.join(args)]
          def run(args,name,timeout=120):
              result=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
              (evidence/(name+'.log')).write_text(result.stdout+'\n'+result.stderr)
              report[name]={'exit_code':result.returncode};assert result.returncode==0,(name,result.returncode,result.stderr)
              return result.stdout
          def start(args,name):
              log=open(evidence/(name+'.log'),'w');logs.append(log)
              p=subprocess.Popen(args,stdout=log,stderr=log);children.append(p);return p
          def diagnose(name):
              details=[]
              for args in ([wine,'--version'],['xdotool','search','--onlyvisible','--name','.*']):
                  try:
                      item=subprocess.run(args,capture_output=True,text=True,timeout=8)
                      details.append(str(args)+'\n'+item.stdout+'\n'+item.stderr)
                      if args[0]=='xdotool':
                          for wid in item.stdout.split()[:20]:
                              title=subprocess.run(['xdotool','getwindowname',wid],capture_output=True,text=True,timeout=2)
                              details.append(wid+' '+title.stdout)
                  except Exception as error:details.append(repr(error))
              (evidence/(name+'-inventory.txt')).write_text('\n'.join(details))
              try:subprocess.run(['import','-window','root',str(evidence/(name+'-root.png'))],capture_output=True,timeout=8)
              except Exception as error:(evidence/(name+'-screenshot-error.txt')).write_text(repr(error))
          def ui(kind,excluded_pid=0):
              diagnose(kind+'-before-probe')
              deadline=time.monotonic()+60;attempt=0
              while time.monotonic()<deadline:
                  attempt+=1;outpath=evidence/(kind+'-probe-'+str(attempt)+'.stdout');errpath=evidence/(kind+'-probe-'+str(attempt)+'.stderr')
                  with outpath.open('w') as output,errpath.open('w') as errors:
                      try:result=subprocess.run([wine,probe,kind],stdout=output,stderr=errors,text=True,timeout=8)
                      except subprocess.TimeoutExpired:
                          report.setdefault('probe_timeouts',[]).append(kind+'-'+str(attempt));result=None
                  text=outpath.read_text(errors='replace');match=re.search(r'PID=(\d+)',text)
                  if result is not None and result.returncode==0 and match and int(match[1])!=excluded_pid:
                      assert not re.search(r'[\u0400-\u052f]',text),'Non-English UI text'
                      (evidence/(kind+'-ui.txt')).write_text(text)
                      run(['import','-window','root',str(evidence/(kind+'-gui.png'))],kind+'-screenshot')
                      return int(match[1]),text
                  time.sleep(.4)
              diagnose(kind+'-timeout')
              raise AssertionError(kind+' GUI was not verified within60seconds')
          def host(path):
              assert path[:3].upper()=='C:'+chr(92),path
              return prefix/'drive_c'/path[3:].replace(chr(92),'/')
          def idle_render(name,version,quiet):
              deadline=time.monotonic()+90
              while time.monotonic()<deadline:
                  text=run([wine,probe,'launcher'],name+'-settle',15)
                  if 'CHECK_ENABLED=1' in text:break
                  time.sleep(.5)
              else:raise AssertionError('Update check did not settle before idle rendering measurement')
              subprocess.run(['xdotool','mousemove','2','2'],check=True)
              time.sleep(2)
              title='^RA3 60 FPS Launcher '+re.escape(version)+'$'
              ids=subprocess.run(['xdotool','search','--onlyvisible','--name',title],capture_output=True,text=True,check=True).stdout.split()
              assert len(ids)==1,('Ambiguous launcher X window',ids)
              d=display.Display();assert d.has_extension('DAMAGE'),'XDamage is required for the rendering regression'
              d.damage_query_version()
              window=d.create_resource_object('window',int(ids[0]));geometry=window.get_geometry()
              assert geometry.width>100 and geometry.height>100
              window.damage_create(damage.DamageReportRawRectangles);d.sync()
              while d.pending_events():d.next_event()
              events=[];samples=[]
              def screenshot(index):
                  image=window.get_image(0,0,geometry.width,geometry.height,X.ZPixmap,0xffffffff)
                  pixels=Image.frombytes('RGB',(geometry.width,geometry.height),bytes(image.data),'raw','BGRX');digest=hashlib.sha256(pixels.tobytes()).hexdigest()
                  pixels.save(evidence/(name+'-'+str(index)+'.png'))
                  samples.append({'seconds':round(time.monotonic()-started,3),'pixel_sha256':digest})
              started=time.monotonic();screenshot(0);next_sample=started+2.5
              while time.monotonic()-started<5:
                  while d.pending_events():
                      event=d.next_event()
                      if event.type==d.extension_event.DamageNotify:
                          events.append({'seconds':round(time.monotonic()-started,3),'x':event.area.x,'y':event.area.y,'width':event.area.width,'height':event.area.height})
                  if len(samples)==1 and time.monotonic()>=next_sample:screenshot(1)
                  time.sleep(.02)
              d.sync()
              while d.pending_events():
                  event=d.next_event()
                  if event.type==d.extension_event.DamageNotify:events.append({'seconds':round(time.monotonic()-started,3),'x':event.area.x,'y':event.area.y,'width':event.area.width,'height':event.area.height})
              screenshot(2);d.close()
              result={'version':version,'seconds':5,'method':'XDamage RawRectangles on the actual visible launcher X window','damage_events':len(events),'events':events[:100],'screenshots':samples,'unchanged_pixels':len({s['pixel_sha256'] for s in samples})==1}
              (evidence/(name+'.json')).write_text(json.dumps(result,indent=2));report[name]=result
              if quiet:
                  assert result['damage_events']==0,('Idle launcher still repaints',result)
                  assert result['unchanged_pixels'],'Idle launcher pixels changed'
              else:assert result['damage_events']>=3,'The old 0.3.3 timer did not reproduce rendering activity; regression test is inconclusive'
          try:
              run([wine,'wineboot','-u'],'wineboot',180)
              # Differential control: the exact public 0.3.3 launcher must still
              # show timer-driven redraw activity before testing the fix.
              baseline_root=prefix/'drive_c/RA3FPS Baseline'
              run(command(baseline_setup,'/S','/DESKTOP=0','/D='+win(baseline_root)),'baseline-install',180)
              baseline_launcher=start(command(baseline_root/'RA3FPS.exe'),'baseline-launcher')
              ui('launcher');idle_render('baseline-idle','0.3.3',False)
              run([wine,probe,'launcher','close'],'baseline-close');baseline_launcher.wait(timeout=30)
              run(command(baseline_root/'Uninstall.exe','/S'),'baseline-uninstall',180)
              deadline=time.monotonic()+45
              while any((baseline_root/name).exists() for name in ('RA3FPS.exe','Uninstall.exe','.ra3fps-nsis')) and time.monotonic()<deadline:time.sleep(.4)
              assert not any((baseline_root/name).exists() for name in ('RA3FPS.exe','Uninstall.exe','.ra3fps-nsis')),'Baseline launcher was not removed'
              time.sleep(.5)
              local_text=run([wine,probe,'env'],'localappdata')
              local=re.search(r'^LOCALAPPDATA=(.+)$',local_text,re.M).group(1).strip()
              default_path=local+chr(92)+'Begosik'+chr(92)+'RA3FPS';default_root=host(default_path)
              fake=prefix/'drive_c/Old Registered RA3FPS';fake.mkdir();(fake/'keep.bin').write_bytes(b'fake-previous-installation-sentinel')
              run([wine,probe,'fake-arp',win(fake)],'fake-previous-registration')
              # A real visible wizard must appear; a zero exit code is insufficient.
              wizard=start(command(setup),'wizard')
              _,text=ui('setup');assert 'Next' in text and 'Cancel' in text and 'Choose a folder' in text
              run([wine,probe,'setup','next'],'wizard-next')
              time.sleep(.5);_,directory_text=ui('setup')
              edits=[line[5:].strip() for line in directory_text.splitlines() if line.startswith('EDIT=')]
              assert any(path.rstrip(chr(92)).lower()==default_path.lower() for path in edits),('Wizard directory is not the LOCALAPPDATA default',edits,default_path)
              (evidence/'default-directory-ui.txt').write_text(directory_text)
              run([wine,probe,'setup','close'],'wizard-cancel');wizard.wait(timeout=30)
              report['wizard']={'visible':True,'cancel_exit':wizard.returncode,'directory_default_correct':True}
              # A stale prior ARP path must not redirect an ordinary no-/D install.
              run(command(setup,'/S','/DESKTOP=0'),'default-noD-install',180)
              default_files={p.relative_to(default_root).as_posix() for p in default_root.rglob('*') if p.is_file()}
              default_cursors={p for p in default_files if p.startswith('assets/cursors/') and p.endswith('.ani')}
              default_required={'RA3FPS.exe','engine/ra3_1.12.game','profiles/ra3_1.12.rpf','profiles/ra3_1.12_reference.rpf','Uninstall.exe','.ra3fps-nsis'}
              assert len(default_cursors)==79 and default_files==default_required|default_cursors,'Default install payload differs'
              assert '0.3.4.0'.encode('utf-16le') in (default_root/'RA3FPS.exe').read_bytes(),'Wrong default-installed launcher version'
              assert {p.name:p.read_bytes() for p in fake.iterdir()}=={'keep.bin':b'fake-previous-installation-sentinel'},'Default install changed the previous ARP folder'
              default_launcher=start(command(default_root/'RA3FPS.exe'),'default-launcher')
              ui('launcher');idle_render('candidate-idle','0.3.4',True)
              run([wine,probe,'launcher','close'],'default-close');default_launcher.wait(timeout=30)
              run(command(default_root/'Uninstall.exe','/S'),'default-uninstall',180)
              deadline=time.monotonic()+45
              while any((default_root/name).exists() for name in default_required|default_cursors) and time.monotonic()<deadline:time.sleep(.4)
              assert not any((default_root/name).exists() for name in default_required|default_cursors),'Default launcher uninstall failed'
              time.sleep(.5)
              report['default_path_install']={'passed':True,'no_D_option':True,'path':default_path,'fake_previous_folder_unchanged':True}
              install='C:\\RA3FPS Verification';root=prefix/'drive_c/RA3FPS Verification'
              run(command(setup,'/S','/DESKTOP=0','/D='+install),'silent-install',180)
              files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
              cursors={p for p in files if p.startswith('assets/cursors/') and p.endswith('.ani')}
              required={'RA3FPS.exe','engine/ra3_1.12.game','profiles/ra3_1.12.rpf','profiles/ra3_1.12_reference.rpf','Uninstall.exe','.ra3fps-nsis'}
              assert len(cursors)==79 and files==required|cursors,sorted(files-required-cursors)
              assert '0.3.4.0'.encode('utf-16le') in (root/'RA3FPS.exe').read_bytes(),'Wrong launcher version'
              game=prefix/'drive_c/Game Fixture';game.mkdir();original=game/'RA3_1.12.game';original.write_bytes(b'unchanged-game-fixture')
              before=hashlib.sha256(original.read_bytes()).hexdigest()
              launcher=start(command(root/'RA3FPS.exe'),'launcher-before-update')
              old_pid,text=ui('launcher');assert 'Check updates' in text
              keep={root/'Sessions/keep.bin':b'persistent-session',root/'Logs/keep.log':b'persistent-log',root/'unrelated.bin':b'unrelated-file'}
              for p,data in keep.items():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              (root/'settings.ini').write_text('[Verification]\nKeep=preserved\n')
              # Alter a bundled file to prove updates overwrite it without remembered hashes.
              cursor=next(iter(cursors));cursor_path=root/cursor;cursor_data=cursor_path.read_bytes();cursor_path.write_bytes(b'changed-runtime-file')
              updater=start(command(setup,'/S','/UPDATE','/RESTART','/WAITPID='+str(old_pid),'/D='+install),'update')
              run([wine,probe,'launcher','close'],'close-before-update');launcher.wait(timeout=30)
              update_exit=updater.wait(timeout=180);report['update']={'exit_code':update_exit};assert update_exit==0,'Update installer failed'
              new_pid,_=ui('launcher',excluded_pid=old_pid);assert new_pid!=old_pid,'Launcher was not restarted'
              assert cursor_path.read_bytes()==cursor_data,'Changed bundled file was not replaced'
              for p,data in keep.items():assert p.read_bytes()==data,('Update lost data',str(p))
              assert 'Keep=preserved' in (root/'settings.ini').read_text(errors='replace'),'Settings were lost'
              run([wine,probe,'launcher','close'],'close-after-update')
              time.sleep(2)
              # Register A, then launch/update a copied B. Explicit /D=B must
              # override the old ARP path without changing A's files.
              def snapshot(folder):return {p.relative_to(folder).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in folder.rglob('*') if p.is_file()}
              original_root=root;original_snapshot=snapshot(original_root)
              copied=prefix/'drive_c/RA3FPS Copied';shutil.copytree(root,copied)
              copied_launcher=start(command(copied/'RA3FPS.exe'),'copied-launcher')
              copied_pid,_=ui('launcher');copied_cursor=copied/cursor;copied_cursor.write_bytes(b'copied-directory-target')
              copied_path='C:'+chr(92)+'RA3FPS Copied'
              copied_update=start(command(setup,'/S','/UPDATE','/RESTART','/WAITPID='+str(copied_pid),'/D='+copied_path),'copied-update')
              run([wine,probe,'launcher','close'],'copied-close-before-update');copied_launcher.wait(timeout=30)
              copied_exit=copied_update.wait(timeout=180);assert copied_exit==0,('Copied update exit',copied_exit)
              copied_new_pid,_=ui('launcher',excluded_pid=copied_pid)
              assert copied_cursor.read_bytes()==cursor_data,'Explicit /D did not replace B payload'
              marker=configparser.ConfigParser();marker.read(copied/'.ra3fps-nsis',encoding='utf-16')
              assert marker['Install']['Path'].rstrip(chr(92)).lower()==copied_path.lower(),'Ownership marker did not move to B'
              assert snapshot(original_root)==original_snapshot,'Copied update changed old registered A'
              assert copied_new_pid!=copied_pid,'Copied launcher was not restarted'
              report['copied_install_update']={'passed':True,'exit_code':copied_exit,'old_registered_folder_unchanged':True}
              run([wine,probe,'launcher','close'],'copied-close-after-update');time.sleep(2);root=copied
              run(command(root/'Uninstall.exe','/S'),'uninstall',180)
              deadline=time.monotonic()+45
              while any((root/name).exists() for name in required|cursors) and time.monotonic()<deadline:time.sleep(.4)
              assert not any((root/name).exists() for name in required|cursors),'Uninstall left launcher payload files'
              assert (root/'unrelated.bin').read_bytes()==b'unrelated-file','Uninstall removed unrelated data'
              assert hashlib.sha256(original.read_bytes()).hexdigest()==before,'Game fixture was changed'
              report.update({'passed':True,'installed_payload_files':83,'cursor_files':79,'update_overwrite':True,'data_preserved':True,'restart_pid_changed':True,'unrelated_and_game_files_preserved':True})
          except Exception:
              report['passed']=False;report['failure']=traceback.format_exc();raise
          finally:
              diagnose('final')
              (evidence/'result.json').write_text(json.dumps(report,indent=2))
              # This command is scoped exclusively to the created test prefix.
              server=shutil.which('wineserver') or next((str(p) for p in (pathlib.Path('/usr/lib/wine/wineserver64'),pathlib.Path('/usr/lib/wine/wineserver')) if p.exists()),None)
              if server:subprocess.run([server,'-k'],env=os.environ,timeout=15)
              for log in logs:log.close()
          PY
      - name: Preserve screenshots, UI dumps and exit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RA3FPS-0.3.4-Wine-verification
          path: evidence
          retention-days: 7
