              idle_render('candidate-borderless-off-idle','1.0.2',True,'60 FPS v2')
              report['borderless_ui']={'passed':True,'default_off':True,'toggle_on':True,'persisted_on_after_restart':True,'toggle_off':True,'persisted_off_after_restart':True,'idle_after_toggles_zero_damage':True}
              report['removed_features']={'passed':True,'reference_and_replay_controls_absent':True,'stale_settings_retired':True,'missing_replay_ignored':True,'one_60_FPS_profile':True}
              run([wine,probe,'launcher','close'],'default-close');default_launcher.wait(timeout=30)
