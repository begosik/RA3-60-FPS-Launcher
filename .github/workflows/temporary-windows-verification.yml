        run: |
          mkdir -p evidence
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  out=super().redirect_request(req,fp,code,msg,headers,url)
                  if urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(url).netloc:
                      out.remove_header('Authorization')
                  return out
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          opener=urllib.request.build_opener(Redirect)
          def open_request(request):
              try:return opener.open(request)
              except urllib.error.HTTPError as error:
                  try:body=json.loads(error.read().decode('utf-8',errors='replace'))
                  except (ValueError,UnicodeError):body={}
                  # Only GitHub's diagnostic fields; never headers, tokens or signed URLs.
                  safe={key:body[key] for key in ('message','documentation_url','status') if key in body}
                  message=json.dumps(safe,ensure_ascii=True).replace(os.environ['GH_TOKEN'],'[redacted]')
                  raise RuntimeError('GitHub HTTP '+str(error.code)+': '+message) from None
          release_id=os.environ['RELEASE_ID'];assert release_id.isdecimal(),'Numeric release ID required'
          release=json.load(open_request(urllib.request.Request(api+'/releases/'+release_id,headers=headers)))
          assert release['draft'] is True and release['tag_name']=='1.0.2','Candidate must remain a private 1.0.2 draft'
          assert len(release['assets'])==1,'Candidate draft must contain only the installer'
          asset=next(a for a in release['assets'] if a['name']==os.environ['ASSET_NAME'])
          headers['Accept']='application/octet-stream'
          data=open_request(urllib.request.Request(api+'/releases/assets/'+str(asset['id']),headers=headers)).read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest==os.environ['EXPECTED_SHA'].lower(),'Installer SHA-256 mismatch'
          pathlib.Path('candidate.exe').write_bytes(data)
          pathlib.Path('evidence/download.json').write_text(json.dumps({'draft':True,'asset':asset['name'],'bytes':len(data),'sha256':digest},indent=2))
          headers['Accept']='application/vnd.github+json'
          baseline=json.load(open_request(urllib.request.Request(api+'/releases/tags/1.0.1',headers=headers)))
          assert baseline['id']==411881504 and baseline['draft'] is False and baseline['tag_name']=='1.0.1','Baseline must be the public 1.0.1 release'
          old_asset=next(a for a in baseline['assets'] if a['name']=='RA3FPS_Setup_1.0.1_NSIS.exe')
          headers['Accept']='application/octet-stream'
          old_data=open_request(urllib.request.Request(api+'/releases/assets/'+str(old_asset['id']),headers=headers)).read()
          old_digest=hashlib.sha256(old_data).hexdigest()
          assert old_digest=='40077c2e73d43a5e87e51f3a2121386a389371ed111196b567ad5b4f6d252610' and len(old_data)==3807251,'Baseline installer bytes differ'
          pathlib.Path('baseline.exe').write_bytes(old_data)
          pathlib.Path('evidence/baseline-download.json').write_text(json.dumps({'draft':False,'version':'1.0.1','asset':old_asset['name'],'bytes':len(old_data),'sha256':old_digest},indent=2))
