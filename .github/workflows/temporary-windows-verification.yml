name: Temporary RA3FPS Windows verification
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric private draft release ID
        required: true
      asset:
        description: Installer asset in the private draft
        required: true
        default: RA3FPS_Setup_1.0.2_NSIS.exe
      sha256:
        description: SHA-256 of the candidate installer
        required: true
        default: d58dacb2960fc08238f0f925ad20e1915e0a7f94778b7698a90f0d6606550984
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
