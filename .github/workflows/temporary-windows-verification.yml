          cat > run_wine_borderless_probe.py <<'RUNNERPY'
          """Execute the production Borderless helper with harmless real Win32 fixtures.

          Requires an existing Wine display (normally Xvfb in CI). The only Windows
          processes started are copies of the probe; no game or renderer is started.
          """
          from pathlib import Path
          import argparse
          import hashlib
          import json
          import os
          import shlex
          import subprocess


          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def main() -> None:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--probe', type=Path, required=True)
              parser.add_argument('--evidence', type=Path, required=True)
              parser.add_argument('--provenance', type=Path)
              parser.add_argument('--runner', default='wine')
              args = parser.parse_args()
              probe = args.probe.resolve()
              evidence = args.evidence.resolve()
              evidence.mkdir(parents=True, exist_ok=True)
              before = sha(probe)
              if args.provenance:
                  provenance = json.loads(args.provenance.read_text(encoding='utf-8'))
                  assert provenance['probe_sha256'] == before, 'Probe differs from its compiled production-helper provenance'
                  assert provenance['probe_bytes'] == probe.stat().st_size
                  (evidence / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
              report = evidence / 'win32-borderless-result.json'
              if report.exists():
                  report.unlink()
              for old_trace in evidence.glob(report.name + '.*.lifecycle.log'):
                  old_trace.unlink()
              win_report = 'Z:' + str(report).replace('/', '\\')
              result = subprocess.run(
                  [*shlex.split(args.runner), str(probe), win_report],
                  env=os.environ, capture_output=True, timeout=30,
              )
              (evidence / 'probe.stdout').write_bytes(result.stdout)
              (evidence / 'probe.stderr').write_bytes(result.stderr)
              lifecycle = {path.name: path.read_text(encoding='utf-8', errors='replace')
                           for path in sorted(evidence.glob(report.name + '.*.lifecycle.log'))}
              if result.returncode != 0:
                  failure = json.loads(report.read_text(encoding='utf-8')) if report.exists() else {'status': 'FAIL', 'step': 'fixture exited without report'}
                  failure['runner_exit_code'] = result.returncode
                  failure['probe_sha256'] = before
                  failure['child_lifecycle'] = lifecycle
                  (evidence / 'result.json').write_text(json.dumps(failure, indent=2) + '\n', encoding='utf-8')
                  print(json.dumps(failure, indent=2), flush=True)
                  raise AssertionError('Actual Win32 Borderless fixture failed; see reported phase and child lifecycle above')
              assert report.exists(), 'The real Win32 fixture did not write its success report'
              data = json.loads(report.read_text(encoding='utf-8'))
              assert data['status'] == 'PASS' and data['scenarios'] == 3
              for field in (
                  'delayed_window', 'exact_class_and_pid', 'wrong_class_unchanged', 'other_pid_unchanged',
                  'hidden_unchanged', 'owned_unchanged', 'monitor_rect_used', 'frame_styles_removed',
                  'applied_once', 'no_activate_or_topmost', 'foreground_preserved', 'no_termination',
                  'waits_for_child_exit', 'early_exit', 'disabled_no_window_operations',
              ):
                  assert data[field] is True, field
              assert data['gameplay_tested'] is False and data['gpu_tested'] is False
              assert sha(probe) == before, 'The fixture changed the executable'
              data['probe_sha256'] = before
              data['runner_exit_code'] = result.returncode
              data['probe_unchanged'] = True
              data['child_lifecycle'] = lifecycle
              (evidence / 'result.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
              print(json.dumps(data, indent=2))


          if __name__ == '__main__':
              main()
          RUNNERPY
      - name: Download the private draft installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ inputs.asset }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          mkdir -p evidence
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  out=super().redirect_request(req,fp,code,msg,headers,url)
                  if urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(url).netloc:
                      out.remove_header('Authorization')
                  return out
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          opener=urllib.request.build_opener(Redirect)
          def open_request(request):
              try:return opener.open(request)
              except urllib.error.HTTPError as error:
                  try:body=json.loads(error.read().decode('utf-8',errors='replace'))
                  except (ValueError,UnicodeError):body={}
                  # Only GitHub's diagnostic fields; never headers, tokens or signed URLs.
                  safe={key:body[key] for key in ('message','documentation_url','status') if key in body}
                  message=json.dumps(safe,ensure_ascii=True).replace(os.environ['GH_TOKEN'],'[redacted]')
                  raise RuntimeError('GitHub HTTP '+str(error.code)+': '+message) from None
          release_id=os.environ['RELEASE_ID'];assert release_id.isdecimal(),'Numeric release ID required'
          release=json.load(open_request(urllib.request.Request(api+'/releases/'+release_id,headers=headers)))
          assert release['draft'] is True and release['tag_name']=='1.0.2','Candidate must remain a private 1.0.2 draft'
          assert len(release['assets'])==1,'Candidate draft must contain only the installer'
          asset=next(a for a in release['assets'] if a['name']==os.environ['ASSET_NAME'])
          headers['Accept']='application/octet-stream'
          data=open_request(urllib.request.Request(api+'/releases/assets/'+str(asset['id']),headers=headers)).read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest==os.environ['EXPECTED_SHA'].lower(),'Installer SHA-256 mismatch'
          pathlib.Path('candidate.exe').write_bytes(data)
          pathlib.Path('evidence/download.json').write_text(json.dumps({'draft':True,'asset':asset['name'],'bytes':len(data),'sha256':digest},indent=2))
          headers['Accept']='application/vnd.github+json'
          baseline=json.load(open_request(urllib.request.Request(api+'/releases/tags/1.0.1',headers=headers)))
          assert baseline['id']==411881504 and baseline['draft'] is False and baseline['tag_name']=='1.0.1','Baseline must be the public 1.0.1 release'
          old_asset=next(a for a in baseline['assets'] if a['name']=='RA3FPS_Setup_1.0.1_NSIS.exe')
          headers['Accept']='application/octet-stream'
          old_data=open_request(urllib.request.Request(api+'/releases/assets/'+str(old_asset['id']),headers=headers)).read()
          old_digest=hashlib.sha256(old_data).hexdigest()
          assert old_digest=='40077c2e73d43a5e87e51f3a2121386a389371ed111196b567ad5b4f6d252610' and len(old_data)==3807251,'Baseline installer bytes differ'
          pathlib.Path('baseline.exe').write_bytes(old_data)
          pathlib.Path('evidence/baseline-download.json').write_text(json.dumps({'draft':False,'version':'1.0.1','asset':old_asset['name'],'bytes':len(old_data),'sha256':old_digest},indent=2))
          PY
      - name: Build the read-only Windows UI probe
        run: |
          cat > probe.c <<'C'
          /* Test-only bounded real GUI probe for the optional Borderless setting.
           * Installer/UI probe 1.0.1 behavior is retained; this file is never installed. */
          #include <windows.h>
          #include <stdio.h>
          #include <wchar.h>
          static int launcher,action;
          static DWORD deadline;
          static int expired(void){return (LONG)(GetTickCount()-deadline)>=0;}
          static int gettext(HWND h,WCHAR*s,int count){DWORD_PTR result=0;s[0]=0;if(expired())return 0;return SendMessageTimeoutW(h,WM_GETTEXT,count,(LPARAM)s,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result)!=0;}
          static void value(const char*key,const WCHAR*text){char b[16384]={0};WideCharToMultiByte(CP_UTF8,0,text,-1,b,sizeof(b),0,0);printf("%s%s\n",key,b);fflush(stdout);}
          static void line(HWND h){WCHAR s[4096]={0};if(!gettext(h,s,4096))return;for(WCHAR*p=s;*p;p++)if(*p=='\n'||*p=='\r')*p=' ';if(*s)value("",s);}
          static BOOL CALLBACK child(HWND h,LPARAM x){
            (void)x;if(expired())return FALSE;
            if(IsWindowVisible(h)){
              WCHAR c[128]={0},s[4096]={0};GetClassNameW(h,c,128);line(h);
              if(lstrcmpiW(c,L"Edit")==0&&gettext(h,s,4096))value("EDIT=",s);
            }
            return !expired();
          }
          static int check_state(HWND h){DWORD_PTR result=~(DWORD_PTR)0;if(!h||!SendMessageTimeoutW(h,BM_GETCHECK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result))return -1;return (int)result;}
          static BOOL CALLBACK window(HWND h,LPARAM x){
            (void)x;if(expired())return FALSE;if(!IsWindowVisible(h))return TRUE;
            WCHAR c[128]={0},t[256]={0};GetClassNameW(h,c,128);DWORD pid=0;GetWindowThreadProcessId(h,&pid);
            fprintf(stderr,"WINDOW hwnd=%p pid=%lu\n",h,pid);fflush(stderr);
            if(!gettext(h,t,256))return !expired();
            if(launcher?wcscmp(c,L"BegosikRA3FPS")!=0:(wcsstr(t,L"60 FPS v2 Setup")==0&&wcsstr(t,L"RA3 60 FPS Patcher Setup")==0))return TRUE;
            printf("PID=%lu\nHWND=%p\n",pid,h);fflush(stdout);value("TITLE=",t);line(h);EnumChildWindows(h,child,0);
            if(launcher){
              HWND check=GetDlgItem(h,102),borderless=GetDlgItem(h,112);unsigned old=(GetDlgItem(h,202)!=0)+(GetDlgItem(h,110)!=0)+(GetDlgItem(h,111)!=0);
              printf("CHECK_ENABLED=%d\nOBSOLETE_CONTROLS=%u\nBORDERLESS_CONTROL=%d\nBORDERLESS_ENABLED=%d\nBORDERLESS_CHECK=%d\n",check&&IsWindowEnabled(check),old,borderless!=0,borderless&&IsWindowEnabled(borderless),check_state(borderless));fflush(stdout);
              if(action==3||action==4){
                int desired=action==3?BST_CHECKED:BST_UNCHECKED;DWORD_PTR result=0;int before=check_state(borderless);
                if(before<0||(before!=desired&&!SendMessageTimeoutW(borderless,BM_CLICK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result)))fprintf(stderr,"BORDERLESS_TOGGLE_UNAVAILABLE\n");
                printf("BORDERLESS_AFTER=%d\n",check_state(borderless));fflush(stdout);
              }
            }
            if(action==1){HWND yes=GetDlgItem(h,IDYES);if(yes){DWORD_PTR result=0;SendMessageTimeoutW(yes,BM_CLICK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result);}else PostMessageW(h,WM_CLOSE,0,0);}
            if(action==2){HWND next=GetDlgItem(h,IDOK);DWORD_PTR result=0;if(!next||!SendMessageTimeoutW(next,BM_CLICK,0,0,SMTO_ABORTIFHUNG|SMTO_BLOCK,100,&result))fprintf(stderr,"NEXT_BUTTON_UNAVAILABLE\n");}
            return !expired();
          }
          static int command(WCHAR*text){
            WCHAR cmd[32768];STARTUPINFOW si={0};PROCESS_INFORMATION pi={0};si.cb=sizeof(si);lstrcpynW(cmd,text,32768);
            if(!CreateProcessW(0,cmd,0,0,0,0,0,0,&si,&pi)){printf("CREATE_ERROR=%lu\n",GetLastError());return 1;}
