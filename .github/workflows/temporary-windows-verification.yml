st": "Altered persistent runtime, cursor and config are regenerated; no session identity rejection",\n      "status": "PASS"\n    },\n    {\n      "test": "Vanilla mounts CP before nested original configs once; rewrites resources and every set-exe",\n      "status": "PASS"\n    },\n    {\n      "test": "Mod original argument path preserved; replay argument absent; CP excluded; 4GB enabled for mods too",\n      "status": "PASS"\n    },\n    {\n      "test": "Missing CP inherited includes/archive/search-path skipped inline without popup",\n      "status": "PASS"\n    },\n    {\n      "test": "Stale Reference30=1 and valid Replay preference ignored; always bundled 60-FPS runtime",\n      "status": "PASS"\n    },\n    {\n      "test": "Stale Reference30=1 and missing Replay preference ignored; always bundled 60-FPS runtime",\n      "status": "PASS"\n    },\n    {\n      "test": "Stored Mod preference survives obsolete Replay/Reference cleanup; mod launch keeps 4GB",\n      "status": "PASS"\n    },\n    {\n      "test": "Default launch uses plain fullscreen command and exact native infinite process wait",\n      "status": "PASS"\n    },\n    {\n      "test": "Vanilla stale Borderless=1 ignored and retired; other display/mod settings preserved; no window-mode flags",\n      "status": "PASS"\n    },\n    {\n      "test": "Mod stale Borderless=1 ignored and retired; other display/mod settings preserved; no window-mode flags",\n      "status": "PASS"\n    },\n    {\n      "test": "Missing/damaged packaged profile gives specific error before process creation and retains runtime",\n      "status": "PASS"\n    },\n    {\n      "test": "CP1251 + no 8.3 aliases + Cyrillic launcher/mod paths: vanilla includes nested CP and keeps 4GB",\n      "status": "PASS",\n      "acp": 1251,\n      "short_aliases": false,\n      "generated_sku_encoding": "strict UTF-8",\n      "app_path": "C:\\\\\\u041c\\u043e\\u0434\\u044b \\u043d\\u0430 RA3\\\\60 FPS v2",\n      "game_path": "C:\\\\Program F