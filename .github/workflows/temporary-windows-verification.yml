          """Run actual Wine diagnostic APIs in disposable fixtures; no game execution."""
          from pathlib import Path
          import argparse,hashlib,json,os,shlex,shutil,subprocess
          def main():
           p=argparse.ArgumentParser(description=__doc__);p.add_argument('--event-probe',type=Path,required=True);p.add_argument('--retention-probe',type=Path,required=True);p.add_argument('--evidence',type=Path,required=True);p.add_argument('--runner',default='wine');a=p.parse_args();e=a.evidence.resolve();e.mkdir(parents=True,exist_ok=True);win=lambda p:'Z:'+str(p.resolve()).replace('/','\\');reports={}
           for name,exe,args in [('event-log',a.event_probe,[win(e/'event-fixtures')]),('retention',a.retention_probe,[win(e/'retention-fixtures')])]:
