              run(command(baseline_setup,'/S','/DESKTOP=0','/D='+win(baseline_root)),'baseline-install',180)
              baseline_launcher=start(command(baseline_root/'RA3FPS.exe'),'baseline-launcher')
              _,baseline_ui=ui('launcher');assert 'OBSOLETE_CONTROLS=0' in baseline_ui,'The public baseline controls differ'
              idle_render('baseline-idle','1.0.1',True,'60 FPS v2')
              run([wine,probe,'launcher','close'],'baseline-close');baseline_launcher.wait(timeout=30)
              run(command(baseline_root/'Uninstall.exe','/S'),'baseline-uninstall',180)
              deadline=time.monotonic()+45
              while any((baseline_root/name).exists() for name in ('RA3FPS.exe','Uninstall.exe','.ra3fps-nsis')) and time.monotonic()<deadline:time.sleep(.4)
              assert not any((baseline_root/name).exists() for name in ('RA3FPS.exe','Uninstall.exe','.ra3fps-nsis')),'Baseline launcher was not removed'
              time.sleep(.5)
              local_text=run([wine,probe,'env'],'localappdata')
              local=re.search(r'^LOCALAPPDATA=(.+)$',local_text,re.M).group(1).strip()
              default_path=local+chr(92)+'Begosik'+chr(92)+'RA3FPS';default_root=host(default_path)
              fake=prefix/'drive_c/Old Registered RA3FPS';fake.mkdir();(fake/'keep.bin').write_bytes(b'fake-previous-installation-sentinel')
              run([wine,probe,'fake-arp',win(fake)],'fake-previous-registration')
              # A real visible wizard must appear; a zero exit code is insufficient.
              wizard=start(command(setup),'wizard')
              _,text=ui('setup');assert 'Next' in text and 'Cancel' in text and 'Choose a folder' in text
