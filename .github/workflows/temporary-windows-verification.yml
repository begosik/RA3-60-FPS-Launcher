          assert hashlib.sha256(data).hexdigest()=='dee4f83dff4c844e3176f1bedb819b6b1afd532b2c834a047aec04d82d8c3076'
          pathlib.Path('wine_retention_probe105.exe').write_bytes(data)
          pathlib.Path('evidence/wine_retention_probe105-provenance.json').write_text('{\n  "scope": "Current production headers and actual Win32 APIs; RA3/gameplay not run",\n  "source_sha256": {\n    "src/platform.h": "b8aac2416117eb3a0f19bab6bdd08bf82fbc984430fc3e1271f5ece33746f64f",\n    "src/crash_report.h": "3076a6cf4f6c15b8ba7d153d6639cdb67c98d3e88122c60f50aca8da5a565ce5",\n    "src/log_retention.h": "a2412b62b7ffa337701051fbc614b568a25f997a39e1ef2b726c91f434bd4518",\n    "src/process_guard.h": "7d537e5f8c93399476e6003c335572d884b433fa69015430c0d147f42a530ac0",\n    "src/winmini.h": "58a43dc9aba434c3497e5ef08280c29ccab8257a48ef5d134ad36df3e41f9043",\n    "tools/build.py": "21bdc1798494992102633db1bb4b35d982d494432b250d16408b162c2fba39f0"\n  },\n  "fixture_source_sha256": "11fe2cd2f6d91cf5860ae7f2f719ce61053abee6fc63f8f2da554bc94e43eb9e",\n  "builder_sha256": "e21d050ec69f07cbf13e3694b1db2bf45ff773ede311859ec2426055aacde50d",\n  "probe_sha256": "dee4f83dff4c844e3176f1bedb819b6b1afd532b2c834a047aec04d82d8c3076",\n  "probe_bytes": 33280\n}\n')
          PY
          cat > run_wine_diagnostics105.py <<'RUNNERPY'
          """Run actual Wine diagnostic APIs in disposable fixtures; no game execution."""
          from pathlib import Path
          import argparse,hashlib,json,os,shlex,shutil,subprocess
          def main():
           p=argparse.ArgumentParser(description=__doc__);p.add_argument('--event-probe',type=Path,required=True);p.add_argument('--retention-probe',type=Path,required=True);p.add_argument('--evidence',type=Path,required=True);p.add_argument('--runner',default='wine');a=p.parse_args();e=a.evidence.resolve();e.mkdir(parents=True,exist_ok=True);win=lambda p:'Z:'+str(p.resolve()).replace('/','\\');reports={}
           for name,exe,args in [('event-log',a.event_probe,[win(e/'event-fixtures')]),('retention',a.retention_probe,[win(e/'retention-fixtures')])]:
            target=e/(name+'-result.json');target.unlink(missing_ok=True)
            if name=='retention':
             root=e/'retention-fixtures/reparse';logs=root/'Logs';logs.mkdir(parents=True,exist_ok=True)
             protected=root/'outside-protected.bin';protected.write_bytes(b'\x6d'*32)
             leaf=logs/'fpslab-E20-mode1-2001-1-1-1-0-0-625-2147483393-1.log';os.symlink('../outside-protected.bin',leaf)
             assert leaf.is_symlink() and leaf.resolve()==protected.resolve() and protected.read_bytes()==b'\x6d'*32
            result=subprocess.run(shlex.split(a.runner)+[str(exe.resolve()),*args,win(target)],env=os.environ,capture_output=True,timeout=90);(e/(name+'.stdout')).write_bytes(result.stdout);(e/(name+'.stderr')).write_bytes(result.stderr)
            assert target.is_file(),(name,result.returncode,result.stdout,result.stderr);data=json.loads(target.read_text());reports[name]=data
            assert result.returncode==0 and data['passed'] is True,(name,result.returncode,data,result.stderr)
            if name=='event-log':
             assert data['status']=='UNSUPPORTED' and data['backend_available_under_wine'] is False,'Available Event Log backend requires synthetic Event1000 capture before approval'
             assert data['real_windows_event_capture_verified'] is False and data['evt_next_timeout']==0 and data['system32_load_flags']==2048
             for key in ('own_process_identity_verified','fallback_report_written','fallback_exit_code_preserved'):assert data[key] is True,key
             crash_reports=list((e/'event-fixtures/Logs').glob('game-crash-*.txt'));assert len(crash_reports)==1
             content=crash_reports[0].read_text(encoding='utf-8');assert 'Exit code: 0xC0000005' in content and 'Event ID: 1000' not in content
             assert 'Process ID: '+str(data['own_process_id']) in content
             data['fallback_report_sha256']=hashlib.sha256(crash_reports[0].read_bytes()).hexdigest()
             data['fallback_report_fields']={line.split(': ',1)[0]:line.split(': ',1)[1] for line in content.splitlines() if line.startswith(('Process ID: ','Process creation FILETIME: ','Exit code: '))}
             target.write_text(json.dumps(data,indent=2)+'\n')
            else:
             for key in ('closed_session_deletion','real_sharing_lock_preserved_then_unlocked_deleted','20MiB_quota_and_4MiB_launcher_reservation','actual_live_pid_preserved_with_closed_files','unknown_files_preserved'):assert data[key] is True,key
             for key in ('symlink_created','symlink_preserved','reparse_leaf_verified_before_cleanup','reparse_leaf_verified_after_cleanup','reparse_target_bytes_unchanged'):assert data[key] is True,key
             assert leaf.is_symlink() and os.readlink(leaf)=='../outside-protected.bin' and protected.read_bytes()==b'\x6d'*32
             data['fixture_inventory']=[{'name':str(p.relative_to(e/'retention-fixtures')),'bytes':p.lstat().st_size,'symlink':p.is_symlink()} for p in (e/'retention-fixtures').rglob('*') if p.is_file() or p.is_symlink()]
             target.write_text(json.dumps(data,indent=2)+'\n')
           # Remove only these deliberately created fixture trees after their assertions;
           # artifacts retain result metadata, provenance and bounded stdout/stderr.
           for name in ('event-fixtures','retention-fixtures'):
            shutil.rmtree(e/name,ignore_errors=True)
           (e/'result.json').write_text(json.dumps({'passed':True,**reports},indent=2)+'\n');print(json.dumps(reports,indent=2))
          if __name__=='__main__':main()
          RUNNERPY
      - name: Verify only the new collector and retention functions
        env:
          WINEPREFIX: ${{ runner.temp }}/ra3fps105-diagnostics-only-prefix
          WINEDEBUG: '-all'
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,traceback
          e=pathlib.Path('evidence');wine='/usr/lib/wine/wine64'
          result={'passed':False,'scope':'diagnostics_only','installer_checks_rerun':False,
                  'installer_sha256':'259653e4afc9f1de5a79812f35c9c5cfea9ef1daf39d0ab646aa96fb91776d0e',
                  'installer_bytes':3820401,
                  'initial_full_result_sha256':'c3991229a2ceaedfac40c1d04bcf9345cba79d01ee66f33ac7e0a0e4d3db387b',
                  'initial_full_workflow_sha256':'5efb813cc97dc1998ddd341b3815eb73a6bfc9425ae427a1a3f153b38dadf0c8',
                  'initial_full_run_id':38564600376,'initial_full_overall_passed':False}
          try:
              boot=subprocess.run([wine,'wineboot','-u'],capture_output=True,timeout=150)
              (e/'wineboot.log').write_bytes(boot.stdout+b'\n'+boot.stderr)
              assert boot.returncode==0,boot.returncode
              probe=subprocess.run(['/usr/bin/python3','run_wine_diagnostics105.py','--event-probe','wine_eventlog_probe105.exe','--retention-probe','wine_retention_probe105.exe','--evidence',str(e/'diagnostics'),'--runner',wine],capture_output=True,timeout=190)
              (e/'diagnostics-regression.log').write_bytes(probe.stdout+b'\n'+probe.stderr)
              assert probe.returncode==0,(probe.returncode,probe.stderr)
              result['diagnostics_wine']=json.loads((e/'diagnostics/result.json').read_text())
              assert result['diagnostics_wine']['passed'] is True
              result['passed']=True
          except Exception:
              result['failure']=traceback.format_exc();raise
          finally:
              for name in ('event-fixtures','retention-fixtures'):
                  folder=e/'diagnostics'/name
                  if folder.exists():
                      inventory=[{'name':str(p.relative_to(folder)),'bytes':p.lstat().st_size,'symlink':p.is_symlink(),'target':os.readlink(p) if p.is_symlink() else None} for p in folder.rglob('*') if p.is_file() or p.is_symlink()]
                      (e/(name+'-inventory.json')).write_text(json.dumps(inventory,indent=2));shutil.rmtree(folder)
              (e/'result.json').write_text(json.dumps(result,indent=2))
              subprocess.run(['/usr/lib/wine/wineserver','-k'],capture_output=True,timeout=20)
          PY
      - name: Save only new diagnostic result and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 60FPS-v2-1.0.5-diagnostics-only
          path: evidence/
          if-no-files-found: error
