          cat > run_wine_utf8_probe.py <<'RUNNERPY'
          """Run the extracted production UTF-8 probe against actual Wine filesystem APIs.
          The old CP1251 bytes must fail the engine-style UTF-8 path consumer, while the
          candidate's generated nested configs must open each referenced fixture resource.
          """
          from pathlib import Path
          import argparse
          import hashlib
          import json
          import os
          import shlex
          import subprocess

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def snapshot(path):
              return {p.relative_to(path).as_posix(): sha(p) for p in path.rglob('*') if p.is_file()}

          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--probe', type=Path, required=True)
              parser.add_argument('--evidence', type=Path, required=True)
              parser.add_argument('--runner', default='wine')
              args = parser.parse_args()
              evidence = args.evidence.resolve()
              evidence.mkdir(parents=True, exist_ok=True)
              app = evidence / 'Моды на RA3' / '60 FPS v2'
              game = evidence / 'Steam' / 'steamapps' / 'common' / 'Red Alert 3'
              (app / 'Data').mkdir(parents=True, exist_ok=True)
              (game / 'Data').mkdir(parents=True, exist_ok=True)
              engine = app / 'Data/ra3_1.12.game'
              archive = game / 'Data/Текстуры.big'
              engine.write_bytes(b'UNCHANGED RESOURCE OPEN FIXTURE, NOT EXECUTABLE')
              archive.write_bytes(b'UNCHANGED UTF-8 RESOURCE OPEN FIXTURE')
              before_engine, before_game = sha(engine), snapshot(game)
              report = evidence / 'win32-utf8-result.json'
              if report.exists():
                  report.unlink()
              win = lambda path: 'Z:' + str(path.resolve()).replace('/', '\\')
              command = shlex.split(args.runner) + [str(args.probe.resolve()), win(app), win(game), win(report)]
              result = subprocess.run(command, env=os.environ, capture_output=True, timeout=45)
              (evidence / 'probe.stdout').write_bytes(result.stdout)
              (evidence / 'probe.stderr').write_bytes(result.stderr)
              assert result.returncode == 0, (result.returncode, result.stdout, result.stderr)
              assert report.exists(), 'Win32 probe did not emit its success report'
              data = json.loads(report.read_text())
              assert data['status'] == 'PASS' and data['old_cp1251_rejected_as_utf8'] is True
              assert data['nested_configs_consumed'] == 3 and data['utf8_resource_opens'] == 4
              assert sha(engine) == before_engine and snapshot(game) == before_game
              checked = []
              for name in ('RA3_english_1.12.SkuDef', 'config-1.SkuDef', 'config-2.SkuDef'):
                  path = app / name
                  content = path.read_bytes().decode('utf-8', errors='strict')
                  assert '\ufffd' not in content and not content.startswith('\ufeff')
                  for line in content.splitlines():
                      directive, value = line.split(' ', 1)
                      assert directive in ('set-exe', 'add-config', 'add-big')
                      assert value.startswith('Z:\\') and Path(value[2:].replace('\\', '/')).is_file()
                  checked.append({'name': name, 'sha256': sha(path), 'utf8': True})
              try:
                  (app / 'old-acp.SkuDef').read_bytes().decode('utf-8', errors='strict')
              except UnicodeDecodeError:
                  pass
              else:
                  raise AssertionError('Old CP1251 config unexpectedly decodes as UTF-8')
              data['originals_unchanged'] = True
              data['configs_verified_against_host_files'] = checked
              (evidence / 'result.json').write_text(json.dumps(data, indent=2) + '\n')
              print(json.dumps(data, ensure_ascii=False, indent=2))

          if __name__ == '__main__':
              main()
          RUNNERPY
      - name: Download the private draft installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_NAME: ${{ inputs.asset }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          mkdir -p evidence
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.parse,urllib.request
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  out=super().redirect_request(req,fp,code,msg,headers,url)
                  if urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(url).netloc:
                      out.remove_header('Authorization')
                  return out
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          opener=urllib.request.build_opener(Redirect)
          def open_request(request):
              try:return opener.open(request)
              except urllib.error.HTTPError as error:
                  try:body=json.loads(error.read().decode('utf-8',errors='replace'))
                  except (ValueError,UnicodeError):body={}
                  # Only GitHub's diagnostic fields; never headers, tokens or signed URLs.
                  safe={key:body[key] for key in ('message','documentation_url','status') if key in body}
                  message=json.dumps(safe,ensure_ascii=True).replace(os.environ['GH_TOKEN'],'[redacted]')
                  raise RuntimeError('GitHub HTTP '+str(error.code)+': '+message) from None
          release_id=os.environ['RELEASE_ID'];assert release_id.isdecimal(),'Numeric release ID required'
          release=json.load(open_request(urllib.request.Request(api+'/releases/'+release_id,headers=headers)))
          assert release['draft'] is True and release['tag_name']=='1.0.4','Candidate must remain a private 1.0.4 draft'
          assert len(release['assets'])==1,'Candidate draft must contain only the installer'
          asset=next(a for a in release['assets'] if a['name']==os.environ['ASSET_NAME'])
          headers['Accept']='application/octet-stream'
          data=open_request(urllib.request.Request(api+'/releases/assets/'+str(asset['id']),headers=headers)).read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest==os.environ['EXPECTED_SHA'].lower(),'Installer SHA-256 mismatch'
          pathlib.Path('candidate.exe').write_bytes(data)
          pathlib.Path('evidence/download.json').write_text(json.dumps({'draft':True,'asset':asset['name'],'bytes':len(data),'sha256':digest},indent=2))
          headers['Accept']='application/vnd.github+json'
