name: Temporary RA3FPS Windows verification
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric private draft release ID
        required: true
      asset:
        description: Installer asset in the private draft
        required: true
        default: RA3FPS_Setup_1.0.4_NSIS.exe
      sha256:
        description: SHA-256 of the candidate installer
        required: true
        default: 1854b1aa831eecf11c2ffab9d6b4dab74d4eeadf4bf3952e8535761e056cc432
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Ubuntu Wine and GUI tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 wine xvfb xauth xdotool imagemagick gcc-mingw-w64-x86-64 python3-xlib python3-pil
      - name: Restore the frozen native launch regression proof
        run: |
          mkdir -p evidence
          /usr/bin/python3 - <<'PY'
          import json,pathlib
          data=json.loads('{\n  "scope": "Production main.c startup, game_actions.h and ui_selection.h; process command recorded; RA3 never executed. Compiled natively; real UTF-8 host filesystem behind Win32 boundary adapters.",\n  "limitations": [\n    "UI rendering and RA3 gameplay were not run",\n    "Registry fixture intentionally supplies no game language",\n    "Native Windows kernel was not run"\n  ],\n  "path_regression": {\n    "acp": 1251,\n    "short_aliases": false,\n    "cyrillic_app_folder": "\\u041c\\u043e\\u0434\\u044b \\u043d\\u0430 RA3",\n    "source_sku_encodings": [\n      "ASCII",\n      "UTF-8",\n      "CP1251"\n    ],\n    "generated_sku_encoding": "strict UTF-8"\n  },\n  "removed_features": "Reference30, replay selection and Borderless removed; legacy settings ignored and retired; one bundled 60-FPS profile",\n  "user_correction": "4GB applies to vanilla and mods; Community Patch applies only to vanilla",\n  "bundled_base_sha256": "29aa6b66fc298188fa42df7218a1dea7e181a946a54d0d8841000906f9f4d98e",\n  "bundled_base_size": 9402416,\n  "installed_profile_sha256": "b80ff708efb2bdc6356876e6499ece77d7c3d8175edcde2110691859c21737e5",\n  "source_provenance": {\n    "src/main.c": "beb6144848d121dd5789611a0b8f76ce578d9ab3237e1d3cf494ff09543ffef7",\n    "src/game_actions.h": "f8c3625d631d3b83e1976d89449fa6708224632ecfb20d2a909d0c575ec77e60",\n    "src/ui_selection.h": "0690937d2080b0ae304289e9a12031c6ba065af76b5b75cfb3a87b55c0d459fb",\n    "src/platform.h": "b8aac2416117eb3a0f19bab6bdd08bf82fbc984430fc3e1271f5ece33746f64f",\n    "src/winmini.h": "71998b41dd191d81e91e1d53b5f190027d421947cf205d0b66774d27cf54715d",\n    "src/patch_engine.c": "fd00ab5b4835e9192c0e5bd3f54b98a0001b2f5f5bd96f47f0dd1121a20f6030"\n  },\n  "test_provenance": {\n    "test_release031.py": "ce8d136333cd79c6c250f26db78ffd7718fc52de5d2eb36692ce2a77e5a50d2b",\n    "probe_release031.c": "03c1eecf0ca67eaec72a4b4b2b2d2d6fb421a38f631db72c466e2dc5f99048ca"\n  },\n  "runtime_sha256": "8b4ae