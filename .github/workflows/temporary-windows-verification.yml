              except Exception as error:
                  borderless_failure=error;report['borderless_fixture_pending_error']=str(error)
              child_result=evidence/'borderless/result.json'
              report['borderless_child_windows']=json.loads(child_result.read_text()) if child_result.exists() else {'status':'FAIL','step':'fixture did not produce a result'}
              # The public 1.0.1 baseline remains the latest while 1.0.2 is private.
