              default_required={'RA3FPS.exe','engine/ra3_1.12.game','profiles/ra3_1.12.rpf','Uninstall.exe','.ra3fps-nsis'}
              assert len(default_cursors)==79 and default_files==default_required|default_cursors,'Default install payload differs'
              installed_profile=hashlib.sha256((default_root/'profiles/ra3_1.12.rpf').read_bytes()).hexdigest()
              assert installed_profile=='b80ff708efb2bdc6356876e6499ece77d7c3d8175edcde2110691859c21737e5','Installed runtime profile differs from the native-tested candidate'
